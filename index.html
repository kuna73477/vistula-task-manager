<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Task Manager</h1>
      <p class="student">Student ID: <span id="student-id">73477</span></p>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <form id="task-form">
        <h2 id="form-heading">Add a task</h2>
        <label for="task-title">Title</label>
        <input type="text" id="task-title" name="title" required placeholder="Do maths homework">

        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="4" placeholder="Optional details"></textarea>

        <div class="form-actions">
          <button type="submit" id="task-submit">Add task</button>
          <button type="button" id="task-cancel" hidden>Cancel edit</button>
        </div>
      </form>

      <p id="status-message" role="status" aria-live="polite"></p>
    </aside>

    <section class="content">
      <h2>Tasks</h2>
      <div id="task-list"></div>
    </section>
  </main>

  <footer class="footer">
    <a id="contribution-link" href="contribution.html">Contribution page</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
